[workspace]
resolver = "2"
members = [
    "crates/pnext-syntax",
    "crates/pnext-sema",
    "crates/pnext-checker",
    "crates/pnext-compat",
    "crates/pnext-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/crowecawcaw/p-next"

[workspace.dependencies]
pnext-syntax = { path = "crates/pnext-syntax" }
pnext-sema = { path = "crates/pnext-sema" }
pnext-checker = { path = "crates/pnext-checker" }
pnext-compat = { path = "crates/pnext-compat" }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
