[workspace]
resolver = "2"
members = [
    "crates/p-rs",
    "crates/pnext-syntax",
    "crates/pnext-sema",
    "crates/pnext-checker",
    "crates/pnext-compat",
    "crates/pnext-cli",
    "crates/pnext-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/crowecawcaw/p-next"

[workspace.dependencies]
pnext-syntax = { path = "crates/pnext-syntax" }
pnext-sema = { path = "crates/pnext-sema" }
pnext-checker = { path = "crates/pnext-checker" }
pnext-compat = { path = "crates/pnext-compat" }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"

[profile.release]
debug = 1

# Size-optimized build for the WebAssembly module:
#   cargo build --profile wasm --target wasm32-unknown-unknown -p pnext-wasm
[profile.wasm]
inherits = "release"
debug = false
strip = true
opt-level = "s"
lto = true
codegen-units = 1
