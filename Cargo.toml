[workspace]
resolver = "2"
members = [
    "crates/p-rs",
    "crates/prs-syntax",
    "crates/prs-sema",
    "crates/prs-checker",
    "crates/prs-compat",
    "crates/prs-cli",
    "crates/prs-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crowecawcaw/p-rs"

[workspace.dependencies]
prs-syntax = { path = "crates/prs-syntax" }
prs-sema = { path = "crates/prs-sema" }
prs-checker = { path = "crates/prs-checker" }
prs-compat = { path = "crates/prs-compat" }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"

[profile.release]
debug = 1

# Size-optimized build for the WebAssembly module:
#   cargo build --profile wasm --target wasm32-unknown-unknown -p prs-wasm
[profile.wasm]
inherits = "release"
debug = false
strip = true
opt-level = "s"
lto = true
codegen-units = 1
