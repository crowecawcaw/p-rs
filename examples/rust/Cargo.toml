[package]
name = "inventory-integration-example"
version = "0.1.0"
edition = "2021"
publish = false

# A real application's Cargo workspace can depend on the checker in the same way.
# These crates currently ship from source; the published p-rs crate is a placeholder.
[workspace]

[dev-dependencies]
prs-syntax = { path = "../../crates/prs-syntax" }
prs-sema = { path = "../../crates/prs-sema" }
prs-checker = { path = "../../crates/prs-checker" }
proptest = "1.11"
