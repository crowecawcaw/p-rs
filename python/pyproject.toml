# The Python package: `emit` for application code, `check_spec` for tests, a pytest
# plugin, and the `snappea` binary itself. See https://crowecawcaw.github.io/snappea/docs/python.html.
#
#   pip install ./python          # builds the binary with cargo
#   maturin build -m python/pyproject.toml --release   # a wheel

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pysnappea"
description = "Check P specs against events from your Python tests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dynamic = ["version"]
# tomllib is in the standard library from 3.11
dependencies = ["tomli>=1.1; python_version < '3.11'"]
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/crowecawcaw/snappea"
Documentation = "https://crowecawcaw.github.io/snappea/docs/python.html"

[project.entry-points.pytest11]
snappea = "snappea.pytest_plugin"

[tool.maturin]
bindings = "bin"                                 # ships the executable, no bindings
manifest-path = "../crates/snappea/Cargo.toml"
features = ["cli"]                               # the binaries only, not snappea::test
no-default-features = true
python-source = "src"
module-name = "snappea"
strip = true
exclude = ["**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
