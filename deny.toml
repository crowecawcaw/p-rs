# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run locally: cargo deny check

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained/yanked crates (RustSec) fail the check.
# To accept one, add its ID with a reason:
#   ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]
ignore = []

[licenses]
# Permissive licenses only. Copyleft (GPL, LGPL, AGPL, MPL, EPL, ...) and
# anything unlisted is rejected.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
]
confidence-threshold = 0.8
# The list is a policy, not an inventory; unused entries are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace have no version requirement.
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
