# Monthly, grouped update PRs so dependencies don't drift. CI checks each one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /examples/rust
    schedule:
      interval: monthly
    groups:
      cargo-examples:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: maven
    directories: [/java, /examples/java]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: io.github.crowecawcaw:p-rs # set by scripts/release.py
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ["*"]
