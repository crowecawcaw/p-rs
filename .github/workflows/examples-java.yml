name: Java package and inventory examples
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            examples/java/pom.xml
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'
      - run: cargo build --locked -p snappea
      - name: Test and install snappea, with a natives jar holding this build's snappea
        env:
          SNAPPEA_BIN: ${{ github.workspace }}/target/debug/snappea
        run: |
          mkdir -p java/natives/natives-linux-x86_64
          cp target/debug/snappea java/natives/natives-linux-x86_64/snappea
          mvn --batch-mode --no-transfer-progress -f java/pom.xml -Pnatives,release install
      # No SNAPPEA_BIN and no snappea on PATH: the examples get the checker from the natives jar.
      - name: Run Jupiter and jqwik examples
        working-directory: examples/java
        run: mvn --batch-mode --no-transfer-progress test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: java-inventory-diagnostics
          path: |
            java/target/surefire-reports/
            examples/java/target/coverage/
            examples/java/target/snappea/
            examples/java/target/surefire-reports/
            examples/java/.jqwik-database
