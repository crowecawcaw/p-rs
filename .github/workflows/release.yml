# Manually triggered release of every p-rs package at one version. See .github/RELEASING.md.
#
#   Actions -> Release -> Run workflow (on main) -> pick a level
#
#   preflight       fmt, clippy, tests and a package dry run on main.
#   helpers         the Go, Python and Java helper tests against this commit's prs.
#   version         the release version (scripts/release.py next) and whether its tag
#                   already exists (a re-run of a release that got as far as tagging).
#   build           the prs binary for five targets, from this run's commit with the
#                   version applied (scripts/release.py set), so `prs --version` is the
#                   release. Archives prs-vX.Y.Z-<target>.tar.gz (.zip on Windows). If
#                   the tag exists, the archives are downloaded from its GitHub release
#                   instead: the tag's committed checksums name those exact files.
#   prepare         SHA256SUMS of the archives. Commits the release (Cargo.toml, the Java
#                   pom, Go's prsbin version and checksums), tags it v<version>, commits
#                   Go and Java back to development versions, and pushes both commits
#                   and the tag to main atomically.
#   crates          publishes p-rs to crates.io (trusted publishing, no stored token).
#   github-release  creates the GitHub release with the archives and SHA256SUMS (Go
#                   downloads them), then Claude's notes; GitHub's notes are the fallback.
#   python          the Python wheels (python.yml): attached to the release, to PyPI.
#   maven           io.github.crowecawcaw:p-rs with natives jars built from the
#                   archives, to Maven Central. Skipped, with a notice, until the
#                   Maven secrets exist.
#   Go needs only the tag.
#
# Every publish step skips a version that is already published, so a failed run can be
# finished by re-running its failed jobs, or by a new run with level=release.
#
# crates.io trusts this file name (release.yml) and the `release` environment; keep
# both if you edit this workflow.

name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - release # publish the current version without bumping

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight checks
    if: github.repository == 'crowecawcaw/p-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo publish -p p-rs --locked --dry-run

  helpers:
    name: Preflight helper tests
    if: github.repository == 'crowecawcaw/p-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PRS_BIN: ${{ github.workspace }}/target/debug/prs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: false
      - run: cargo build -p p-rs --bin prs --locked
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Go
        run: |
          go vet ./...
          go test -count=1 ./...
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Python
        run: |
          pip install ./python pytest
          cd python && python -m pytest -p no:cacheprovider
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'
      - name: Java
        run: mvn --batch-mode --no-transfer-progress -f java/pom.xml test

  version:
    name: Release version
    if: github.repository == 'crowecawcaw/p-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tagged: ${{ steps.version.outputs.tagged }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute the version
        id: version
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/release.py next "$LEVEL")
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            if [ "$LEVEL" != release ]; then
              echo "::error::${tag} already exists. Use level=release to finish that release." >&2
              exit 1
            fi
            tagged=true
            echo "${tag} already exists: finishing that release with its archives." >> "$GITHUB_STEP_SUMMARY"
          else
            tagged=false
          fi
          echo "Releasing ${tag}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "tagged=${tagged}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build prs (${{ matrix.target }})
    needs: version
    strategy:
      matrix:
        include:
          # Linux: glibc 2.17 or newer, through cargo-zigbuild.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: true, run: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest, run: true }
          # Static CRT: no Visual C++ redistributable needed.
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: true, rustflags: "-C target-feature=+crt-static" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      EXE: ${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reuse the tagged release's archive
        if: needs.version.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git show "${TAG}:go/internal/prsbin/SHA256SUMS" | grep -F "  prs-${TAG}-${TARGET}." > "$RUNNER_TEMP/SHA256SUMS"
          name=$(awk '{print $2}' "$RUNNER_TEMP/SHA256SUMS")
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "$name"; then
            echo "::error::${TAG} has no ${name} on its GitHub release. Re-run the failed jobs of the run that pushed ${TAG}: its artifacts hold the archives." >&2
            exit 1
          fi
          python scripts/release.py verify dist "$RUNNER_TEMP/SHA256SUMS"

      - uses: dtolnay/rust-toolchain@stable
        if: needs.version.outputs.tagged != 'true'
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: needs.version.outputs.tagged != 'true' && matrix.zig
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.16.0

      - name: Apply the release version
        if: needs.version.outputs.tagged != 'true'
        run: |
          python scripts/release.py set "$VERSION"
          cargo update --workspace
      - name: Build
        if: needs.version.outputs.tagged != 'true'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = true ]; then
            cargo zigbuild --release --locked -p p-rs --bin prs --target "${TARGET}.2.17"
          else
            cargo build --release --locked -p p-rs --bin prs --target "$TARGET"
          fi
      - name: Check the version it reports
        if: needs.version.outputs.tagged != 'true' && matrix.run
        run: |
          got=$("target/${TARGET}/release/prs${EXE}" --version | tr -d '\r')
          [ "$got" = "prs ${VERSION}" ] || { echo "::error::prs --version says '${got}', want 'prs ${VERSION}'" >&2; exit 1; }
      - name: Package
        if: needs.version.outputs.tagged != 'true'
        run: python scripts/release.py package "$TARGET" "$VERSION" "target/${TARGET}/release/prs${EXE}" dist

      - uses: actions/upload-artifact@v5
        with:
          name: archive-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  prepare:
    name: Commit and tag
    needs: [preflight, helpers, version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: python3 scripts/release.py sums dist "$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

      - name: Check the tag's checksums
        if: needs.version.outputs.tagged == 'true'
        run: |
          set -euo pipefail
          git show "${TAG}:go/internal/prsbin/SHA256SUMS" | diff - dist/SHA256SUMS
          echo "${TAG} exists and its checksums match the archives; nothing to commit."

      - uses: dtolnay/rust-toolchain@stable
        if: needs.version.outputs.tagged != 'true'
      - uses: actions/setup-go@v6
        if: needs.version.outputs.tagged != 'true'
        with:
          go-version: stable
          cache: false
      - name: Commit, tag and push
        if: needs.version.outputs.tagged != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The release: every package at VERSION, Go with the archives' checksums.
          python3 scripts/release.py set "$VERSION" --sums dist/SHA256SUMS
          # Refresh the workspace's entries in the lock files without touching dependencies.
          cargo update --workspace
          cargo update --manifest-path examples/rust/Cargo.toml -p p-rs
          go test -count=1 ./go/internal/prsbin
          git add Cargo.toml Cargo.lock examples/rust/Cargo.lock java/pom.xml examples/java/pom.xml go/internal/prsbin
          git commit -m "Release p-rs ${TAG}"
          git tag -a "${TAG}" -m "p-rs ${TAG}"

          # Then main goes back to development versions: Go "dev" (a checkout downloads
          # no binary) and Java <next patch>-SNAPSHOT (a local install never shadows the
          # release). Cargo.toml keeps the release version.
          python3 scripts/release.py dev
          go test -count=1 ./go/internal/prsbin
          git add java/pom.xml examples/java/pom.xml go/internal/prsbin
          git commit -m "Release p-rs ${TAG}: back to development"

          # Atomic: main and the tag move together or not at all. If main moved since
          # the run started, the push fails and nothing is published.
          git push --atomic origin HEAD:main "${TAG}"

  crates:
    name: Publish to crates.io
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Select Rust stable
        run: rustup update stable --no-self-update

      - name: Check whether this version is already published
        id: exists
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'p-rs release workflow (github.com/crowecawcaw/p-rs)' \
            "https://crates.io/api/v1/crates/p-rs/${VERSION}")
          if [ "$code" = 200 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "p-rs ${VERSION} is already on crates.io; skipping publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        if: steps.exists.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: cargo +stable publish -p p-rs --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create GitHub release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write # claude-code-action exchanges an OIDC token
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets

      # First, so Go's download works right after the tag: the release, with the
      # archives and SHA256SUMS. Never replaces an asset: their checksums are committed.
      - name: Create the release with its archives
        id: release
        env:
          ASSETS: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for file in "$ASSETS"/*; do
              if ! grep -qxF "$(basename "$file")" <<<"$have"; then
                gh release upload "$TAG" "$file"
              fi
            done
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" "$ASSETS"/* --title "p-rs $TAG" --verify-tag --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7
        if: steps.release.outputs.created == 'true'
        with:
          node-version: 22

      # Notes: code collects the merged PRs, Claude picks the user-visible
      # changes (.github/release-notes-prompt.md), code renders the markdown.
      # Both note steps may fail without blocking: the release keeps GitHub's
      # generated notes.
      - name: Collect commit and PR context
        id: context
        if: steps.release.outputs.created == 'true'
        continue-on-error: true
        run: node .github/scripts/release-notes.mjs context "$TAG" > release-notes-context.txt

      - name: Classify changes with Claude
        if: steps.context.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read,Write" --model opus'
          prompt: |
            Read `.github/release-notes-prompt.md` and follow it exactly.

            The release being documented is `${{ needs.prepare.outputs.tag }}`.
            The commit and PR context is in `release-notes-context.txt`.

            Write the resulting JSON to `release-notes-entries.json` in the
            repository root. Write nothing else.

      - name: Replace the notes with Claude's
        if: steps.release.outputs.created == 'true'
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [ -s release-notes-entries.json ] \
             && node .github/scripts/release-notes.mjs render "$TAG" --entries release-notes-entries.json > "$notes"; then
            cat "$notes"
            gh release edit "$TAG" --notes-file "$notes"
          else
            echo "::warning::Claude release notes unavailable; keeping GitHub's generated notes. Fix with the 'Update release notes' workflow."
          fi

  python:
    name: Python wheels to PyPI
    needs: [prepare, github-release]
    uses: ./.github/workflows/python.yml
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      publish: true

  maven:
    name: Publish to Maven Central
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      HAS_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Check the secrets and whether this version is published
        id: check
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != true ] || [ -z "$MAVEN_GPG_PASSPHRASE" ] || [ -z "$CENTRAL_TOKEN_USERNAME" ] || [ -z "$CENTRAL_TOKEN_PASSWORD" ]; then
            msg="Maven Central skipped: set MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE, CENTRAL_TOKEN_USERNAME and CENTRAL_TOKEN_PASSWORD (.github/RELEASING.md), then re-run this job."
            echo "::notice title=Maven Central skipped::${msg}"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          auth=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)
          published=$(curl -fsS -H "Authorization: Bearer ${auth}" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=io.github.crowecawcaw&name=p-rs&version=${VERSION}" \
            | jq -r '.published') || published=unknown
          if [ "$published" = true ]; then
            echo "io.github.crowecawcaw:p-rs:${VERSION} is already on Maven Central; skipping publish." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.publish == 'true'
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        if: steps.check.outputs.publish == 'true'
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Natives from the release archives
        if: steps.check.outputs.publish == 'true'
        run: python3 scripts/release.py natives "$RUNNER_TEMP/assets" "$RUNNER_TEMP/natives"

      - uses: actions/setup-java@v5
        if: steps.check.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/pom.xml
          # settings.xml server "central"; the credentials come from these variables.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - uses: stCarolas/setup-maven@v5
        if: steps.check.outputs.publish == 'true'
        with:
          maven-version: '3.9.9'
      - name: Import the signing key
        if: steps.check.outputs.publish == 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Deploy
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          pom=$(mvn -q -f java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          [ "$pom" = "$VERSION" ] || { echo "::error::java/pom.xml at ${TAG} is ${pom}, want ${VERSION}" >&2; exit 1; }
          # The tests run against the release's Linux binary.
          PRS_BIN="$RUNNER_TEMP/natives/natives-linux-x86_64/prs" \
            mvn --batch-mode --no-transfer-progress -f java/pom.xml -Pnatives,release,central \
            -Dprs.natives="$RUNNER_TEMP/natives" deploy
          echo "Published io.github.crowecawcaw:p-rs:${VERSION} to Maven Central." >> "$GITHUB_STEP_SUMMARY"
