# Manually triggered release of the `p-rs` crate. See .github/RELEASING.md.
#
#   Actions -> Release -> Run workflow (on main) -> pick a level
#
#   1. preflight  fmt, clippy, tests and a package dry run on main.
#   2. prepare    bumps crates/p-rs's version (unless level=release), commits,
#                 tags v<version> and pushes both to main.
#   3. publish    publishes to crates.io via trusted publishing (no stored token).
#                 A version that is already on crates.io is skipped, so a failed
#                 run can be re-run with level=release.
#   4. github-release  creates the GitHub release. Claude writes the notes from
#                 the merged PRs; GitHub's generated notes are the fallback.
#
# crates.io trusts this file name (release.yml) and the `release` environment;
# keep both if you edit this workflow.

name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - release # publish the current version without bumping

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight checks
    if: github.repository == 'crowecawcaw/p-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo publish -p p-rs --locked --dry-run

  prepare:
    name: Bump version and tag
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: inputs.level != 'release'
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          python3 - "$LEVEL" <<'PY'
          import pathlib, re, sys
          level = sys.argv[1]
          path = pathlib.Path("crates/p-rs/Cargo.toml")
          text = path.read_text()
          m = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"$', text, re.M)
          if not m:
              sys.exit("No plain x.y.z version in crates/p-rs/Cargo.toml")
          major, minor, patch = map(int, m.groups())
          if level == "major":
              major, minor, patch = major + 1, 0, 0
          elif level == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new = f'version = "{major}.{minor}.{patch}"'
          path.write_text(text[: m.start()] + new + text[m.end() :])
          print(f"{m.group(0)} -> {new}")
          PY
          # Refresh p-rs's entry in Cargo.lock without touching dependencies.
          cargo update --workspace
          version=$(cargo pkgid -p p-rs | sed 's/.*[#@]//')
          git add crates/p-rs/Cargo.toml Cargo.lock
          git commit -m "Release p-rs v${version}"

      - name: Tag and push
        id: version
        run: |
          set -euo pipefail
          version=$(cargo pkgid -p p-rs | sed 's/.*[#@]//')
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            if [ "$(git rev-list -n1 "${tag}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::${tag} already exists on a different commit. Bump the version instead." >&2
              exit 1
            fi
            echo "${tag} already exists on HEAD; reusing it."
          else
            git tag -a "${tag}" -m "p-rs ${tag}"
          fi
          # Atomic: main and the tag move together or not at all.
          git push --atomic origin HEAD:main "${tag}"

  publish:
    name: Publish to crates.io
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Select Rust stable
        run: rustup update stable --no-self-update

      - name: Check whether this version is already published
        id: exists
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'p-rs release workflow (github.com/crowecawcaw/p-rs)' \
            "https://crates.io/api/v1/crates/p-rs/${VERSION}")
          if [ "$code" = 200 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "p-rs ${VERSION} is already on crates.io; skipping publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        if: steps.exists.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: cargo +stable publish -p p-rs --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create GitHub release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write # claude-code-action exchanges an OIDC token
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Notes: code collects the merged PRs, Claude picks the user-visible
      # changes (.github/release-notes-prompt.md), code renders the markdown.
      # Both note steps may fail without blocking: the crate is already
      # published, so the release falls back to GitHub's generated notes.
      - name: Collect commit and PR context
        id: context
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-notes.mjs context "$TAG" > release-notes-context.txt

      - name: Classify changes with Claude
        if: steps.context.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read,Write" --model opus'
          prompt: |
            Read `.github/release-notes-prompt.md` and follow it exactly.

            The release being documented is `${{ needs.prepare.outputs.tag }}`.
            The commit and PR context is in `release-notes-context.txt`.

            Write the resulting JSON to `release-notes-entries.json` in the
            repository root. Write nothing else.

      - name: Render release notes
        id: notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [ -s release-notes-entries.json ] \
             && node .github/scripts/release-notes.mjs render "$TAG" --entries release-notes-entries.json > "$notes"; then
            echo "file=$notes" >> "$GITHUB_OUTPUT"
            cat "$notes"
          else
            echo "::warning::Claude release notes unavailable; using GitHub's generated notes. Fix with the 'Update release notes' workflow."
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          if [ -n "$NOTES_FILE" ]; then notes=(--notes-file "$NOTES_FILE"); else notes=(--generate-notes); fi
          gh release create "$TAG" --title "p-rs $TAG" --verify-tag "${notes[@]}"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
