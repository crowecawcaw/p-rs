name: P model example

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-example-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: model-example
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build this checkout's checker
        run: cargo build -p prs-cli --bin prs --locked
      - name: Every example checks the shared spec
        run: |
          shared=examples/model/PSpec/inventory.p
          for link in examples/{python,rust,java,go,multiprocess}/specs/inventory.p; do
            test -L "$link" || { echo "$link is not a symbolic link"; exit 1; }
            test "$(realpath "$link")" = "$(realpath "$shared")" || { echo "$link does not link to $shared"; exit 1; }
          done
      - name: The atomic design keeps the spec in every behaviour
        working-directory: examples/model
        run: ../../target/debug/prs check tcAtomicReserve --exhaustive
      - name: The check-then-reserve design oversells
        working-directory: examples/model
        run: |
          status=0
          ../../target/debug/prs check tcCheckThenReserve -n 1000 || status=$?
          test "$status" -eq 1 || { echo "expected a bug (exit 1), got exit $status"; exit 1; }
          grep -q "reservation exceeds available stock" PCheckerOutput/tcCheckThenReserve/BugFinding/*_0_0.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: model-example-output
          path: examples/model/PCheckerOutput
          if-no-files-found: ignore
