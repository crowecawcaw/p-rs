# Builds the web playground (web/) and publishes it to GitHub Pages via the
# `gh-pages` branch:
#
#   * pushes to main      -> site root          https://<owner>.github.io/<repo>/
#   * maintainer PRs      -> pr/<number>/       https://<owner>.github.io/<repo>/pr/<number>/
#
# A PR gets a sticky comment linking its preview; the preview is removed when the
# PR closes. PRs from forks or non-maintainers are not built here.
#
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch", branch
# `gh-pages`, folder `/ (root)`.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'closed'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The Python API reference, generated from the package's docstrings; the Python
      # docs page links to it. Rust, Go and Java use docs.rs, pkg.go.dev and javadoc.io.
      - name: Python API reference
        run: |
          pip install pdoc==16.0.0
          PYTHONPATH=python/src pdoc --docformat restructuredtext -o web/dist/docs/api/python snappea

      - name: Publish to gh-pages
        id: publish
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER:-}" ]; then dest="pr/${PR_NUMBER}"; else dest="."; fi
          msg="Deploy ${dest} from ${GITHUB_SHA}"
          ./.github/scripts/publish-pages.sh "$dest" web/dist "$msg"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}/"
          if [ -n "${PR_NUMBER:-}" ]; then url="${url}pr/${PR_NUMBER}/"; fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Published to ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        with:
          script: |
            const body = [
              '<!-- pages-preview -->',
              `**Preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}. GitHub Pages can take a minute to update.`,
            ].join('\n');
            await upsert(github, context, body);

            async function upsert(github, context, body) {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
              const old = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- pages-preview -->'));
              if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Remove preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ./.github/scripts/publish-pages.sh "pr/${PR_NUMBER}" "" "Remove preview for PR #${PR_NUMBER}"

      - name: Update comment
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- pages-preview -->'));
            if (old) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: old.id,
                body: '<!-- pages-preview -->\nPreview removed (PR closed).',
              });
            }
