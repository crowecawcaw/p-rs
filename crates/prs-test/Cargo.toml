[package]
name = "prs-test"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "In-process P monitor integration for Rust application tests"

[dependencies]
prs-syntax = { workspace = true }
prs-sema = { workspace = true }
prs-checker = { workspace = true }
prs-compat = { workspace = true }
serde_json = { workspace = true }
prs-emit = { workspace = true }
serde = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
