[package]
name = "p-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The P modeling language in Rust: emit events from your application and check them against P specs in tests, plus the `prs` checker"
documentation = "https://docs.rs/p-rs"
readme = "README.md"
keywords = ["p-language", "model-checking", "formal-methods", "testing", "specification"]
categories = ["development-tools::testing", "command-line-utilities"]
include = ["Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**/*.rs", "src/**/README.md"]

[lib]
name = "prs"

[features]
default = ["cli", "test"]
# `prs::emit`: emit application events (tests, PRS_EVENTS_DIR, production logs). No
# checker; depends only on serde and serde_json. Production code uses only this.
emit = ["dep:serde", "dep:serde_json"]
# `prs::test`: check recorded events against P specs, in process. Also enables the
# library (`prs::syntax`, `prs::sema`, `prs::checker`, `prs::project`, `prs::driver`).
test = ["emit", "dep:regex", "dep:roxmltree", "dep:rustc-hash", "dep:sha2"]
# The `prs` and `prs-compat` binaries, and the library they run on.
cli = ["dep:roxmltree", "dep:rustc-hash", "dep:serde_json", "dep:sha2"]

[[bin]]
name = "prs"
path = "src/bin/prs.rs"
required-features = ["cli"]

[[bin]]
name = "prs-compat"
path = "src/bin/prs-compat.rs"
required-features = ["cli"]

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode"], optional = true }
roxmltree = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
serde = { version = "1", optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
serde = { workspace = true }

[package.metadata.docs.rs]
all-features = true
