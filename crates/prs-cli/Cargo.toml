[package]
name = "prs-cli"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The `prs` command line tool, and `prs-compat`, a drop-in replacement for the upstream P tool"

[[bin]]
name = "prs"
path = "src/main.rs"

[[bin]]
name = "prs-compat"
path = "src/bin/prs-compat.rs"

[dependencies]
prs-compat = { workspace = true }
prs-checker = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "prs_cli"
path = "src/lib.rs"

